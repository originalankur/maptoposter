[project]
name = "maptoposter"
version = "0.2.0"
description = "Generate beautiful, minimalist map posters for any city in the world."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ankur Gupta", email = "originalankur@github.com"}
]
keywords = ["map", "poster", "osm", "openstreetmap", "art", "visualization"]

dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.4.0",
    "osmnx==2.0.7",
    "geopandas==1.1.2",
    "geopy==2.4.1",
    "lat-lon-parser==1.3.1",
    "networkx==3.6.1",
    "requests==2.32.5",
    "shapely==2.1.2",
    "tqdm==4.67.1",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
maptoposter = "create_map_poster:main"
